name: Publish release
run-name: "release ${{ github.event.release.tag_name || inputs.version }}"

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version already committed in main's package.json"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  version:
    if: github.event_name == 'release' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Confirm version and main ancestry
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          if (!/^\d+\.\d+\.\d+$/.test(version)) {
            throw new Error('package.json must declare a stable npm version.');
          }
          if (process.env.EVENT_NAME === 'release') {
            if (process.env.PRERELEASE === 'true' || process.env.RELEASE_TAG !== `v${version}`
              || process.env.GITHUB_REF !== `refs/tags/v${version}`) {
              throw new Error('Publish a stable Release tagged v<package.json version>.');
            }
          } else if (version !== process.env.EXPECTED_VERSION) {
            throw new Error('Enter the stable version already committed in main/package.json.');
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          JS

  checks:
    needs: version
    uses: ./.github/workflows/ci.yml

  package:
    needs: [version, checks]
    uses: ./.github/workflows/npm-package.yml

  release-assets:
    if: github.event_name == 'release'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: release
      - name: Attach the package to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          filename="hypit-hypit-$VERSION.tgz"
          assets="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
          if printf '%s\n' "$assets" | grep -Fxq "$filename"; then
            existing="$(mktemp -d)"
            trap 'rm -rf "$existing"' EXIT
            gh release download "$RELEASE_TAG" --pattern "$filename" --dir "$existing"
            cmp -- "release/$filename" "$existing/$filename" || {
              echo "Release asset $filename exists with different bytes; refusing to publish a mismatched Runtime."
              exit 1
            }
            echo "Release already contains the matching $filename; leaving it unchanged."
          else
            gh release upload "$RELEASE_TAG" "release/$filename"
          fi
      - name: Attach the Piko Runtime manifest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          filename="hypit-runtime-$VERSION.json"
          assets="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
          if printf '%s\n' "$assets" | grep -Fxq "$filename"; then
            existing="$(mktemp -d)"
            trap 'rm -rf "$existing"' EXIT
            gh release download "$RELEASE_TAG" --pattern "$filename" --dir "$existing"
            cmp -- "release/$filename" "$existing/$filename" || {
              echo "Release asset $filename exists with different bytes; refusing to publish a mismatched Runtime."
              exit 1
            }
            echo "Release already contains the matching $filename; leaving it unchanged."
          else
            gh release upload "$RELEASE_TAG" "release/$filename"
          fi
